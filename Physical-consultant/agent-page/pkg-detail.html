<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>套餐详情</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #f5f6f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; border: none; cursor: pointer; }
  [hidden] { display: none !important; }

  .page { max-width: 430px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #f5f6f8; }

  /* ===== 顶部导航 ===== */
  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 10px; background: #f5f6f8; flex-shrink: 0; }
  .app-header__title { font-size: 17px; font-weight: 600; color: #1a1a1a; position: absolute; left: 50%; transform: translateX(-50%); }
  .app-header__btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #1a1a1a; border-radius: 50%; background: none; }
  .app-header__btn:active { background: rgba(0,0,0,.06); }
  .app-header__btn svg { width: 22px; height: 22px; }

  /* ===== 滚动区 ===== */
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px 24px; }
  .body::-webkit-scrollbar { width: 0; }

  /* ===== 套餐主视觉 ===== */
  .pkg-hero { display: flex; gap: 12px; padding: 8px 2px 16px; }
  .pkg-hero__cover { width: 78px; height: 78px; border-radius: 16px; background: linear-gradient(135deg,#fde8e1,#fbd5c4); display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; position: relative; overflow: hidden; }
  .pkg-hero__cover::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.4), transparent 60%); }
  .pkg-hero__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pkg-hero__title { font-size: 17px; font-weight: 700; color: #111418; line-height: 1.35; }
  .pkg-hero__meta { margin-top: 4px; font-size: 11.5px; color: #8a8f96; line-height: 1.6; }
  .pkg-hero__tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .pkg-hero__tag { font-size: 10.5px; color: #0d8a8a; background: rgba(14,143,143,.08); border: 1px solid rgba(14,143,143,.15); padding: 2px 8px; border-radius: 999px; }
  .pkg-hero__tag--hot { color: #fff; background: linear-gradient(135deg,#14a3a3,#0e8f8f); border-color: transparent; }
  .pkg-hero__price { margin-top: auto; padding-top: 8px; display: flex; align-items: baseline; gap: 8px; }
  .pkg-hero__price b { font-size: 24px; font-weight: 800; color: #0a6f6f; letter-spacing: .3px; }
  .pkg-hero__price em { font-style: normal; font-size: 11.5px; color: #b0b5bb; text-decoration: line-through; }
  .pkg-hero__price .save { margin-left: auto; font-size: 10px; color: #fff; background: linear-gradient(135deg,#ffb35c,#f59a2b); padding: 2px 7px; border-radius: 999px; font-weight: 700; white-space: nowrap; }

  /* 通用区块标题 */
  .sec { margin-top: 16px; }
  .sec__title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #111418; margin-bottom: 8px; }
  .sec__title::before { content: ''; width: 3px; height: 14px; border-radius: 2px; background: #0e8f8f; flex-shrink: 0; }
  .sec__title .note { font-size: 11px; font-weight: 500; color: #8a8f96; margin-left: auto; }

  /* 基础档案建立 */
  .profile-card { background: #fff; border: 1px solid #e7ebeb; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; box-shadow: 0 2px 8px rgba(17,20,24,.03); }
  .profile-row { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
  .profile-row__k { color: #8a8f96; min-width: 40px; flex-shrink: 0; }
  .profile-row__v { color: #1a1a1a; font-weight: 600; }

  /* 分组表格 */
  .grp { background: #fff; border: 1px solid #e7ebeb; border-radius: 14px; padding: 6px 0 8px; margin-top: 12px; box-shadow: 0 2px 8px rgba(17,20,24,.03); overflow: hidden; }
  .grp__title { font-size: 12px; font-weight: 700; color: #0d8a8a; padding: 8px 12px 6px; letter-spacing: .02em; }
  .grp table { width: 100%; border-collapse: collapse; }
  .grp thead th { padding: 6px 4px; font-size: 11px; color: #8a8f96; font-weight: 600; background: #f6f8fa; }
  .grp thead th:first-child { text-align: left; padding-left: 12px; }
  .grp thead th:not(:first-child) { text-align: center; width: 52px; }
  .grp tbody td { padding: 7px 4px; font-size: 12px; color: #333; border-bottom: 1px dashed #f0f1f3; }
  .grp tbody td:first-child { text-align: left; padding-left: 12px; line-height: 1.5; }
  .grp tbody td:not(:first-child) { text-align: center; }
  .grp tbody tr:last-child td { border-bottom: none; }
  .grp .cell { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 50%; background: rgba(14,143,143,.12); color: #0e8f8f; font-size: 12px; font-weight: 700; line-height: 1; }
  .grp .cell--off { background: #f0f1f3; color: #c8cbd0; }
  .grp .cell--2 { background: rgba(245,154,43,.14); color: #c98a2b; font-size: 10px; border-radius: 999px; width: auto; padding: 2px 6px; font-weight: 600; }
  .grp .cell--add { background: rgba(245,154,43,.14); color: #c98a2b; font-size: 10px; border-radius: 999px; width: auto; padding: 2px 7px; font-weight: 600; }

  /* 当前档列高亮 */
  .grp thead th.col-hl { color: #0a6f6f; background: #eef7f6; }
  .grp tbody td.col-hl { background: rgba(14,143,143,.05); font-weight: 600; color: #0a6f6f; }

  /* 价格对比 */
  .price-card { background: #fff; border: 1px solid #e7ebeb; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(17,20,24,.03); }
  .price-tbl { width: 100%; border-collapse: collapse; }
  .price-tbl thead th { padding: 9px 6px; font-size: 11.5px; color: #8a8f96; font-weight: 600; background: #f6f8fa; }
  .price-tbl thead th:first-child { text-align: left; padding-left: 14px; }
  .price-tbl thead th:not(:first-child) { text-align: center; }
  .price-tbl tbody td { padding: 11px 6px; font-size: 13px; border-bottom: 1px dashed #f0f1f3; }
  .price-tbl tbody td:first-child { text-align: left; padding-left: 14px; line-height: 1.45; }
  .price-tbl tbody td:not(:first-child) { text-align: center; }
  .price-tbl tbody tr:last-child td { border-bottom: none; }
  .price-tbl .cur td { background: rgba(14,143,143,.06); }
  .price-tbl .cur td:first-child { font-weight: 700; color: #0a6f6f; }
  .price-tbl .cur .badge { display: inline-block; font-size: 10px; color: #fff; background: #0e8f8f; border-radius: 999px; padding: 1px 7px; margin-left: 6px; font-weight: 600; vertical-align: 1px; }
  .price-tbl td s { color: #b0b5bb; text-decoration: line-through; margin-left: 4px; font-size: 11px; }

  .pkg-tip { margin-top: 14px; font-size: 11px; color: #a4aab0; line-height: 1.8; border-top: 1px dashed #e6e9eb; padding: 10px 2px 2px; }

  /* ===== 底部固定操作 ===== */
  .foot { flex-shrink: 0; display: flex; gap: 10px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #e6e9eb; background: #fff; }
  .foot .btn { flex: 1; padding: 12px 0; border-radius: 22px; font-size: 14px; font-weight: 700; }
  .foot .btn--primary { background: linear-gradient(135deg,#14a3a3,#0e8f8f); color: #fff; box-shadow: 0 4px 12px rgba(13,138,138,.18); }
  .foot .btn--primary:active { transform: scale(.98); }
  .foot .btn--ghost { background: #fff; color: #0d8a8a; border: 1px solid rgba(14,143,143,.25); }
  .foot .btn--ghost:active { background: #f4f9f7; }

  .toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 10px 18px; background: rgba(0,0,0,.75); color: #fff; font-size: 14px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 100; white-space: nowrap; }
  .toast.is-visible { opacity: 1; }
</style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <button class="app-header__btn" id="backBtn" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="app-header__title">套餐详情</h1>
      <span style="width:36px"></span>
    </header>

    <div class="body" id="detailBody"></div>

    <div class="foot">
      <button class="btn btn--ghost" id="consultBtn">咨询客服</button>
      <button class="btn btn--primary" id="bookBtn">预约购买</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="pkg-detail-data.js"></script>
  <script src="pkg-detail.js"></script>
</body>
</html>
