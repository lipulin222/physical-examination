<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>个人健康管理计划书</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page page--plan">
    <!-- 顶部导航 -->
    <header class="app-header">
      <button class="app-header__btn" id="backBtn" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="app-header__title">个人健康管理计划书</h1>
      <button class="app-header__btn" id="refreshBtn" aria-label="重新生成" title="重新生成">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 14-4.9M20 12a8 8 0 0 1-14 4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 4v4h-4M6 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <!-- 计划书主体 -->
    <main class="plan" id="planMain">
      <!-- 加载状态 -->
      <div class="plan__loading" id="planLoading" hidden>
        <div class="plan__loading-ring" aria-hidden="true"></div>
        <p class="plan__loading-text">正在结合您的体检结果与回答，生成专属计划书…</p>
        <p class="plan__loading-sub">生成内容较长，约需 30–60 秒，请耐心等待</p>
      </div>

      <!-- 计划书内容（markdown 渲染结果） -->
      <div class="plan__content" id="planContent" hidden></div>
    </main>

    <!-- 轻提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="plan.js"></script>
</body>
</html>
